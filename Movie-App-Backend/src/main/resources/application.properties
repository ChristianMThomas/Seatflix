spring.application.name=SeatFlixDB

# Server Configuration
# Railway uses PORT env variable - this allows dynamic port assignment
server.port=${PORT:8080}

# Database Configuration
# IMPORTANT: Railway provides DATABASE_URL automatically when PostgreSQL is linked
# Railway format: postgresql://user:pass@host:port/dbname
# Spring Boot needs: jdbc:postgresql://user:pass@host:port/dbname
# We'll construct it from Railway's individual variables for compatibility
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Driver auto-detected from URL, but can be explicitly set:
# PostgreSQL: org.postgresql.Driver
# MySQL: com.mysql.cj.jdbc.Driver

# Hibernate properties
spring.jpa.hibernate.ddl-auto=update
# WARNING: Disable show-sql in production to avoid logging sensitive data
spring.jpa.show-sql=${SHOW_SQL:false}
# Dialect auto-detected, but can be explicitly set via DB_DIALECT env var
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format-sql=${FORMAT_SQL:false}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# CORS Configuration
# Set this in Railway to your frontend URL(s), comma-separated
app.cors.allowed-origins=${ALLOWED_ORIGINS}

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Cloudflare R2 (avatar storage)
# Create an R2 API token with Object Read & Write on the bucket, and enable public access
# (r2.dev subdomain or a custom domain) for R2_PUBLIC_URL. Uploads are disabled if unset.
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket=${R2_BUCKET:}
r2.public-url=${R2_PUBLIC_URL:}

# Logging Configuration
# IMPORTANT: Set LOG_LEVEL=INFO in production to avoid excessive logging
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.com.Mind_Forge_SeatFlix.SeatFlix=${APP_LOG_LEVEL:INFO}
